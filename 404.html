<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found — 404</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7faff;
            --accent: #2f5bea;
            --text: #0c1a3a;
            --muted: #54627f;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(520px 260px at 85% 0%, #cfe0ff 0%, transparent 70%), linear-gradient(180deg, #fff, #f1f6ff);
            font-family: Inter, -apple-system, sans-serif;
            color: var(--text);
            text-align: center;
            padding: 24px;
        }
        .container {
            max-width: 480px;
        }
        h1 {
            font: 700 4rem/1 "Playfair Display", Georgia, serif;
            color: var(--accent);
            margin: 0 0 16px;
        }
        h2 {
            font-size: 1.5rem;
            margin: 0 0 12px;
        }
        p {
            color: var(--muted);
            margin: 0 0 24px;
            font-size: 15px;
            line-height: 1.6;
        }
        a.btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 6px 16px rgba(47, 91, 234, .25);
            transition: transform 0.2s;
        }
        a.btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for doesn't exist or has been moved.</p>
        <a href="./" class="btn">Back to Portfolio</a>
    </div>
</body>
</html>
